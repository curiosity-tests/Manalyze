name: CI
run-name: "CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
  pull_request:

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ git libssl-dev libboost-system-dev libboost-test-dev

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake . -DTests=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build . -- -j2

      - name: Verify VirusTotal plugin built (Linux)
        if: runner.os == 'Linux'
        run: test -f bin/libplugin_virustotal.so

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: ./bin/manalyze-tests
